spring:
  application:
    name: finance-manager

  datasource:
    # Defaults match docker-compose.yml; override via environment variables in other environments.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_manager}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Dev-only default so the app runs locally; production MUST set JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    issuer: finance-manager
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  bootstrap-admin:
    # First ADMIN, created at startup if absent. Leave unset to skip.
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
