spring:
  application:
    name: finance-manager

  datasource:
    # Defaults match docker-compose.yml; override via environment variables in other environments.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_manager}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
