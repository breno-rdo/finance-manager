spring:
  application:
    name: finance-manager

  datasource:
    # Defaults match docker-compose.yml; override via environment variables in other environments.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_manager}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # No default on purpose: this repository is public, so a default would be a forgeable key.
    # The app refuses to start without JWT_SECRET (at least 32 characters).
    secret: ${JWT_SECRET}
    issuer: finance-manager
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    # Browser origins allowed to call the API (comma-separated). Default is the Vite dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    # First ADMIN, created at startup if absent. Leave unset to skip.
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
